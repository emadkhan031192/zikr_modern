name: zikr_modern
description: "Zikr Modern - Premium Islamic Tasbeeh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Fonts / UI
  google_fonts: ^6.2.1
  confetti: ^0.7.0

  # Device features
  wakelock_plus: ^1.2.8
  flutter_overlay_window: ^0.4.5
  vibration: ^2.0.1
  sensors_plus: ^6.0.1
  flutter_tts: ^4.1.0
  share_plus: ^10.0.2

  # Group Khatm (optional, offline-safe fallback if not configured)
  firebase_core: ^3.4.1
  cloud_firestore: ^5.4.2
  firebase_auth: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
